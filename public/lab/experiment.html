<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment - Distributed Lock Service Virtual Lab</title>
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/lab/lab.css">
</head>
<body>
<header class="top">
  <a class="brand-link" href="/lab/">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
    <span class="brand">Distributed Lock Service Virtual Lab<span class="crumb" id="crumb"></span></span>
  </a>
  <nav aria-label="Main"><a class="btn-link" href="/lab/">All experiments</a><a class="btn-link" href="/" target="_blank" rel="noopener">Raw dashboard</a></nav>
</header>
<div class="wrap">
  <div class="exp-head">
    <div class="eyebrow" id="expNum"></div>
    <h1 id="expTitle"></h1>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>
</div>
<p class="foot">Made by <b>Tanmay Maniyar</b></p>
<script src="/lab/lab.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('exp') || 'exp2';
  const s = document.createElement('script');
  s.src = '/lab/' + id.replace(/[^a-z0-9]/gi, '') + '.js';
  s.onload = () => buildExperiment(window.EXP);
  s.onerror = () => document.getElementById('expTitle').textContent = 'Experiment not found';
  document.body.append(s);
</script>
</body>
</html>
