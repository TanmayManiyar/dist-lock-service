<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment - Distributed Lock Service Virtual Lab</title>
<link rel="stylesheet" href="/lab/lab.css">
</head>
<body>
<div class="top">
  <div><span class="brand">Distributed Lock Service Virtual Lab</span><div class="crumb" id="crumb"></div></div>
  <div><a href="/lab/">All experiments</a> &middot; <a href="/" target="_blank">Raw dashboard</a></div>
</div>
<div class="wrap">
  <h1 id="expTitle"></h1>
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>
</div>
<script src="/lab/lab.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('exp') || 'exp2';
  const s = document.createElement('script');
  s.src = '/lab/' + id.replace(/[^a-z0-9]/gi, '') + '.js';
  s.onload = () => buildExperiment(window.EXP);
  s.onerror = () => document.getElementById('expTitle').textContent = 'Experiment not found';
  document.body.append(s);
</script>
</body>
</html>
